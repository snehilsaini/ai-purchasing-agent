services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: purchasing_agent
      POSTGRES_USER: purchasing
      POSTGRES_PASSWORD: purchasing
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purchasing -d purchasing_agent"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - purchasing-agent-data:/var/lib/postgresql/data

volumes:
  purchasing-agent-data:
